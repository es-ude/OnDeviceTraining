name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: every job only reads the repo (build/test/cache; nothing
# pushes, comments, or releases). Widen per-job if a future job needs more.
permissions:
  contents: read

jobs:
  # develop and main are both push- and PR-targets, so a commit landing on
  # develop while a develop->main release PR is open fires push AND
  # pull_request for the identical SHA (surfaced by #320/#324): the push
  # run would re-verify a commit the open PR's own pull_request run already
  # covers. Skip (not cancel) the redundant push run before any real job
  # starts, so duplicates show a clean "skipped" rather than a cancelled/
  # failed-looking check.
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - name: Skip push runs already covered by an open PR's checks
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proceed=true
          if [ "${{ github.event_name }}" = "push" ]; then
            # Fail open: if the PR lookup itself errors (API hiccup), dup=0 and
            # this run proceeds normally rather than the gate job going red.
            dup=$(gh pr list --repo "${{ github.repository }}" --state open --limit 100 \
              --json headRefOid --jq "[.[] | select(.headRefOid == \"${{ github.sha }}\")] | length") || dup=0
            if [ "$dup" -gt 0 ]; then
              echo "Commit ${{ github.sha }} is already the head of an open PR; that PR's pull_request-triggered run covers this commit."
              proceed=false
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  alloc-locality:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject malloc/calloc/realloc/free outside src/userApi/
        run: |
          set +e
          matches=$(git grep -nE '\b(malloc|calloc|realloc|free)\s*\(' \
            -- 'src/' 'test/' \
            ':!src/userApi/' \
            ':!*.md' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)')
          set -e
          if [ -n "$matches" ]; then
            echo "Allocation-locality violation: malloc/calloc/realloc/free are only allowed in src/userApi/."
            echo "All other code must route through reserveMemory/freeReservedMemory in src/userApi/StorageApi.{c,h}."
            echo
            echo "Offending lines:"
            echo "$matches"
            exit 1
          fi

  optimizer-step-entry:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject raw optimizerFunctions[].step() calls in examples/
        # #432: the OPTIMIZER phase-hook events fire only inside optimizerStep()
        # (Optimizer.h); a raw vtable step runs the same update but is invisible
        # to an external profiler. Unit tests under test/ stay on the vtable by
        # design (they test the optimizer, not the training-loop entry), so the
        # pathspec is examples/ only -- and only C sources, since the PyTorch
        # twins legitimately call optimizer.step(). The regex matches any
        # member access to `step` (call, `(*fns.step)(o)`, `stepFn_t f = fns.step;`),
        # not just the call spelling; an explicit char class stands in for \b,
        # which macOS ERE ignores. git wildcards cross '/' (no FNM_PATHNAME), so
        # 'examples/*.c' is every .c under examples/.
        run: |
          set +e
          matches=$(git grep -nE '(\.|->)step([^A-Za-z0-9_]|$)' \
            -- 'examples/*.c' 'examples/*.h' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)')
          set -e
          if [ -n "$matches" ]; then
            echo "Optimizer-step-entry violation: examples must step the optimizer through optimizerStep() (src/optimizer/include/Optimizer.h)."
            echo "The raw optimizerFunctions[type].step() call runs the same update but fires no ODT_EVENT_OPTIMIZER_* phase events (#432)."
            echo
            echo "Offending lines:"
            echo "$matches"
            exit 1
          fi

  private-paths:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject references to maintainer-private paths
        # The superpowers spec/plan directory, Claude Code's rules directory and
        # the SDD scratch directory are gitignored: a tracked doc or comment that
        # points into them is a dead link for every reader. Cite the in-repo
        # decision registers in docs/conventions/ instead. The `[s]`/`[e]` char
        # classes keep this pattern from matching its own source.
        run: |
          set +e
          matches=$(git grep -nE 'docs/superpower[s]/|\.claud[e]/|\.superpower[s]/' \
            -- ':!.gitignore')
          set -e
          if [ -n "$matches" ]; then
            echo "Private-path violation: tracked files must not reference gitignored maintainer-local directories."
            echo "Point at docs/conventions/ (decision registers), an issue/PR number, or drop the citation."
            echo
            echo "Offending lines:"
            echo "$matches"
            exit 1
          fi

  remat-row-contract:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject hooks, layer/loss calls, rng calls and data-pointer writes in remat rows
        # #4: a remat scheduler row owns bytes only (rules R1 and R4 in
        # docs/conventions/remat-scheduler.md). No CMake boundary stops a row from
        # calling odtHookFire or an rng* function (both resolve at the final link),
        # so this grep is the guard; it is a text check, not a proof. The file set
        # is fail-closed: every .c/.h under remat/ is scanned unless the run block
        # excludes it as shared code with its reason, so a new row file is gated
        # with no edit here. The coverage check fails the job if the two shipped
        # rows drop out of the set (a rename would make the scan vacuous), and the
        # self-test, in a throwaway repo, proves that every arm still fires. An
        # explicit char class stands in for \b, which macOS ERE ignores; git
        # wildcards cross '/'. The devenv ci script runs this run block verbatim,
        # behind a guard that skips it loudly outside a git work tree.
        run: |
          set +e
          REMAT=src/userApi/training_loop/remat
          ARM_HOOK='odtHook(Fire|Set)'
          ARM_LAYER='layerFunctions'
          ARM_LOSS='lossFunctions'
          ARM_RNG='(^|[^A-Za-z0-9_])rng[A-Z][A-Za-z0-9_]*[[:space:]]*\('
          ARM_DATA_WRITE='(->|\.)data[[:space:]]*(([-+*/%&|^]|<<|>>)?=([^=]|$)|\+\+|--)'
          ARM_DATA_PREINC='(\+\+|--)[[:space:]]*[A-Za-z_(*][][A-Za-z0-9_.>()*-]*(->|\.)data([^A-Za-z0-9_]|$)'
          PATTERN="$ARM_HOOK|$ARM_LAYER|$ARM_LOSS|$ARM_RNG|$ARM_DATA_WRITE|$ARM_DATA_PREINC"
          # Fail-closed file set: every .c/.h under remat/ is a row file unless excluded
          # here as shared code; include/ is scanned too. Each exclusion is shared,
          # never a row, because:
          #   RematCheck.c         the validator, run by the driver
          #   RematPlan.c          the static-plan generator
          #   RematPlanPolicy.c/.h the plan policies, private to RematPlan
          #   RematScheduler.c     the shared dispatch and the row vtable
          #   RematWireTable.c     the row SDK: the one ->data writer; derives headers
          #                        through layerFunctions at bind
          #   RematCheckedSize.h   size helpers shared by the table, the plan and rows
          #   RematRows.h          the rows' entry points, included by the dispatch
          remat_git() {
            root=$1
            shift
            git -C "$root" "$@" -- "$REMAT/*.c" "$REMAT/*.h" \
              ":!$REMAT/RematCheck.c" \
              ":!$REMAT/RematPlan.c" \
              ":!$REMAT/RematPlanPolicy.c" \
              ":!$REMAT/RematPlanPolicy.h" \
              ":!$REMAT/RematScheduler.c" \
              ":!$REMAT/RematWireTable.c" \
              ":!$REMAT/RematCheckedSize.h" \
              ":!$REMAT/RematRows.h"
          }
          # Sets hits to the non-comment matches under the repo root $1; returns 2
          # when git grep itself fails (rc 1 only means no match). A comment line
          # starts with //, a /* comment that runs to the line end, or a * followed
          # by a blank, / or the line end; *hdr = ... and /* x */ code are scanned.
          scan() {
            raw=$(remat_git "$1" grep -nE -e "$PATTERN")
            rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "remat-row-contract: git grep failed (rc=$rc) in $1"
              return 2
            fi
            hits=
            if [ -n "$raw" ]; then
              hits=$(printf '%s\n' "$raw" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*([^*]|\*+[^*/])*(\*+/?)?[[:space:]]*$|\*([[:space:]]|/|$))')
            fi
            return 0
          }
          if ! git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
            echo "remat-row-contract: not a git work tree, so git grep cannot scan; failing closed."
            exit 1
          fi
          gated=$(remat_git . ls-files)
          if [ $? -ne 0 ]; then
            echo "remat-row-contract: git ls-files failed; failing closed."
            exit 1
          fi
          for row in RematArena.c RematHeap.c; do
            case "$gated" in
              *"$REMAT/$row"*) ;;
              *)
                echo "remat-row-contract: $REMAT/$row is not in the gated set; the scan would be vacuous."
                exit 1
                ;;
            esac
          done
          scan . || exit 1
          if [ -n "$hits" ]; then
            echo "Remat-row-contract violation: a scheduler row must not fire a hook, run a layer or a loss, call rng*,"
            echo "or write a header's data pointer outside rematWireBind/rematWireRelease."
            echo "See docs/conventions/remat-scheduler.md."
            echo "A shared, non-row file instead joins the exclusion list in this job's run block, with its reason."
            echo
            echo "Offending lines:"
            echo "$hits"
            exit 1
          fi
          # Self-test in a throwaway repo, never in the checkout: each arm must fire on
          # its plant in a row file, a new tracked row file must be gated, and the
          # controls must stay silent.
          (
            tmp=$(mktemp -d) || exit 1
            trap 'rm -rf "$tmp"' EXIT
            git ls-files -z -- "$REMAT" | while IFS= read -r -d "" f; do
              mkdir -p "$tmp/$(dirname "$f")" && cp "$f" "$tmp/$f" || exit 1
            done || exit 1
            git -C "$tmp" init -q && git -C "$tmp" add -A || exit 1
            heap="$tmp/$REMAT/RematHeap.c"
            cp "$heap" "$tmp/heap.orig" || exit 1
            failed=0
            scan "$tmp" || exit 1
            if [ -n "$hits" ]; then
              echo "remat-row-contract self-test: the unplanted copy is not clean"
              failed=1
            fi
            probe() {
              printf '%s\n' "$2" >> "$heap"
              scan "$tmp" || exit 1
              cp "$tmp/heap.orig" "$heap" || exit 1
              if [ "$1" = fire ] && [ -z "$hits" ]; then
                echo "remat-row-contract self-test: the pattern missed: $2"
                failed=1
              elif [ "$1" = silent ] && [ -n "$hits" ]; then
                echo "remat-row-contract self-test: a control line fired: $2"
                failed=1
              fi
            }
            probe fire 'odtHookFire(0);'
            probe fire 'odtHookSet(0, 0);'
            probe fire 'layerFunctions[0].forward(0);'
            probe fire 'lossFunctions[0].forward(0);'
            probe fire 'rngSetSeed (1u);'
            probe fire '/* bind */ h->data = 0;'
            probe fire 'h->data ='
            probe fire 'h->data += 4;'
            probe fire 't.data = 0;'
            probe fire '++(s->wires[i].hdr->data);'
            probe fire '    *hdr = (tensor_t){.data = NULL};'
            probe silent '// rngNextFloat();'
            probe silent ' * h->data = 0;'
            probe silent 'for (i = 0; i < n; ++i) ok = h->data == 0;'
            probe silent 'h->data[0] = 1;'
            probe silent 'freeReservedMemory(b);'
            probe silent 'rng32_t r;'
            # Two arms on one line, so removing any single arm cannot fake this check.
            printf '%s\n' 'odtHookFire(0); h->data = 0;' > "$tmp/$REMAT/RematPlanted.c"
            git -C "$tmp" add "$REMAT/RematPlanted.c" || exit 1
            scan "$tmp" || exit 1
            if [ -z "$hits" ]; then
              echo "remat-row-contract self-test: a new row file is not gated (the file set is no longer fail-closed)"
              failed=1
            fi
            exit "$failed"
          )
          if [ $? -ne 0 ]; then
            echo "remat-row-contract: the self-test failed; the gate no longer catches what it must."
            exit 1
          fi
          echo "remat-row-contract: clean; self-test passed (11 plants and a new row file fire, 6 controls stay silent)."
          set -e

  c-format-check:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21

      - name: Check format
        run: |
          find src test examples \( -name '*.c' -o -name '*.h' \) -print0 | \
            xargs -0 clang-format-21 --dry-run -Werror

  c-build-and-test:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc

      - name: Assert pinned toolchain (gcc major 13)
        run: |
          gcc --version | head -1
          cmake --version | head -1
          major=$(gcc -dumpversion | cut -d. -f1)
          if [ "$major" != "13" ]; then
            echo "::error::CI gcc major is ${major}, expected 13. Gold tolerances are toolchain-sensitive (FMA contraction); a runner/toolchain bump must be a deliberate re-baseline, never an accident. See docs/conventions/toolchain-parity.md — do NOT loosen tolerances to make golds pass."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python deps for build-time generators
        run: uv sync

      - name: Configure
        run: cmake --preset unit_test

      - name: Build
        run: cmake --build --preset unit_test

      - name: Test
        run: ctest --preset unit_test

  c-asan-build-and-test:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python deps for build-time generators
        run: uv sync

      - name: Configure
        run: CC=clang cmake --preset unit_test_asan

      - name: Build
        run: cmake --build --preset unit_test_asan

      - name: Test
        run: ctest --preset unit_test_asan

  c-ubsan-build-and-test:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python deps for build-time generators
        run: uv sync

      - name: Configure
        run: CC=gcc cmake --preset unit_test_ubsan

      - name: Build
        run: cmake --build --preset unit_test_ubsan

      - name: Test
        run: ctest --preset unit_test_ubsan

  c-bit-parity:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc

      - name: Assert pinned toolchain (gcc major 13)
        run: |
          gcc --version | head -1
          cmake --version | head -1
          major=$(gcc -dumpversion | cut -d. -f1)
          if [ "$major" != "13" ]; then
            echo "::error::CI gcc major is ${major}, expected 13. Gold tolerances are toolchain-sensitive (FMA contraction); a runner/toolchain bump must be a deliberate re-baseline, never an accident. See docs/conventions/toolchain-parity.md — do NOT loosen tolerances to make golds pass."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python deps
        run: uv sync

      # Cache the raw dataset downloads (zip + extracted files). The flaky
      # external hosts (timeseriesclassification.com, archive.ics.uci.edu) are
      # only hit on a cache miss; _download_if_missing() skips the network call
      # when the zip is already present. Keyed on the prep scripts so a URL or
      # download-logic change invalidates the cache and forces a fresh fetch.
      - name: Cache raw datasets
        uses: actions/cache@v4
        with:
          path: |
            examples/har_classifier/data/raw
            examples/ecg_anomaly_ae/data/raw
            examples/mnist_mlp/data/raw
            examples/mnist_cnn/data/raw
          key: datasets-raw-${{ hashFiles('examples/har_classifier/prepare_data.py', 'examples/ecg_anomaly_ae/prepare_data.py', 'examples/mnist_mlp/prepare_data.py', 'examples/mnist_cnn/prepare_data.py') }}

      - name: Cache SpeechCommands raw download (shared, ~2.3 GB)
        uses: actions/cache@v4
        with:
          path: examples/_shared/data/speech_commands
          key: speechcommands-raw-${{ hashFiles('examples/_shared/speechcommands_data.py') }}

      - name: Prepare HAR data
        run: uv run examples/har_classifier/prepare_data.py

      - name: Prepare ECG data
        run: uv run examples/ecg_anomaly_ae/prepare_data.py

      - name: Train PyTorch HAR (produces reference predictions + weights)
        run: uv run examples/har_classifier/train_pytorch.py

      - name: Train PyTorch ECG (produces reference reconstructions + weights)
        run: uv run examples/ecg_anomaly_ae/train_pytorch.py

      - name: Prepare MNIST MLP data
        run: uv run examples/mnist_mlp/prepare_data.py

      - name: Train PyTorch MNIST MLP (produces reference predictions + weights)
        run: uv run examples/mnist_mlp/train_pytorch.py

      - name: Prepare MNIST CNN data
        run: uv run examples/mnist_cnn/prepare_data.py

      - name: Train PyTorch MNIST CNN (produces reference predictions + weights)
        run: uv run examples/mnist_cnn/train_pytorch.py

      - name: Cache kws_mfcc processed data (6-class)
        id: kws-mfcc-cache
        uses: actions/cache@v4
        with:
          path: examples/kws_mfcc/data/6class
          key: kws-mfcc-6class-${{ hashFiles('examples/kws_mfcc/prepare_data.py', 'examples/_shared/speechcommands_data.py') }}

      - name: Prepare kws_mfcc data (6-class; only on cache miss)
        if: steps.kws-mfcc-cache.outputs.cache-hit != 'true'
        run: uv run examples/kws_mfcc/prepare_data.py

      - name: Train PyTorch kws_mfcc (produces reference predictions + weights)
        run: uv run examples/kws_mfcc/train_pytorch.py

      - name: Cache kws_raw processed data (6-class)
        id: kws-raw-cache
        uses: actions/cache@v4
        with:
          path: examples/kws_raw/data/6class
          key: kws-raw-6class-${{ hashFiles('examples/kws_raw/prepare_data.py', 'examples/_shared/speechcommands_data.py') }}

      - name: Prepare kws_raw data (6-class; only on cache miss)
        if: steps.kws-raw-cache.outputs.cache-hit != 'true'
        run: uv run examples/kws_raw/prepare_data.py

      - name: Train PyTorch kws_raw (produces reference predictions + weights)
        run: uv run examples/kws_raw/train_pytorch.py

      - name: Configure
        run: cmake --preset examples

      - name: Build ALL example binaries (rot guard — any broken example fails CI)
        # Builds the default `all` target so every example executable is compiled,
        # not just the two run below. Closes the gap that let example/MnistExperiment
        # (#235) and the legacy v1 trainers silently rot — nothing built them.
        run: cmake --build --preset examples

      - name: Run mixed_width_mlp acceptance example (per-op arithmetic + declared-width storage)
        # Does NOT join bit-parity: mixed SYM_INT32/FLOAT32 wires have no PyTorch
        # twin (SYM divergence is by design). The binary's own in-process hard
        # gates (storage/wire dtypes + a loss-decrease sanity check) are the
        # acceptance criteria; a non-zero exit fails this step.
        run: build/examples/examples/mixed_width_mlp/train_c_mixed_width_mlp

      - name: Run HAR in BIT_PARITY mode
        run: BIT_PARITY=1 build/examples/examples/har_classifier/train_c_har_classifier

      - name: Run ECG in BIT_PARITY mode
        run: BIT_PARITY=1 build/examples/examples/ecg_anomaly_ae/train_c_ecg_anomaly_ae

      - name: Diff HAR predictions (int32, exact match required)
        run: |
          uv run examples/_shared/compare_predictions.py \
            --pytorch examples/har_classifier/outputs/pytorch_predictions.npy \
            --c examples/har_classifier/outputs/c_predictions.npy \
            --dtype int32

      - name: Diff ECG reconstructions (float32, allclose)
        run: |
          uv run examples/_shared/compare_predictions.py \
            --pytorch examples/ecg_anomaly_ae/outputs/pytorch_reconstructions.npy \
            --c examples/ecg_anomaly_ae/outputs/c_reconstructions.npy \
            --dtype float32 \
            --rtol 1e-4 \
            --atol 1e-5

      - name: Run MNIST MLP in BIT_PARITY mode
        run: BIT_PARITY=1 build/examples/examples/mnist_mlp/train_c_mnist_mlp

      - name: Diff MNIST MLP predictions (int32, exact match required)
        run: |
          uv run examples/_shared/compare_predictions.py \
            --pytorch examples/mnist_mlp/outputs/pytorch_predictions.npy \
            --c examples/mnist_mlp/outputs/c_predictions.npy \
            --dtype int32

      - name: Run MNIST CNN in BIT_PARITY mode
        run: BIT_PARITY=1 build/examples/examples/mnist_cnn/train_c_mnist_cnn

      - name: Diff MNIST CNN predictions (int32, exact match required)
        run: |
          uv run examples/_shared/compare_predictions.py \
            --pytorch examples/mnist_cnn/outputs/pytorch_predictions.npy \
            --c examples/mnist_cnn/outputs/c_predictions.npy \
            --dtype int32

      - name: Run kws_mfcc in BIT_PARITY mode
        run: BIT_PARITY=1 build/examples/examples/kws_mfcc/train_c_kws_mfcc

      - name: Diff kws_mfcc predictions (int32, exact match required)
        run: |
          uv run examples/_shared/compare_predictions.py \
            --pytorch examples/kws_mfcc/outputs/6class/pytorch_predictions.npy \
            --c examples/kws_mfcc/outputs/6class/c_predictions.npy \
            --dtype int32

      - name: Run kws_raw in BIT_PARITY mode
        run: BIT_PARITY=1 build/examples/examples/kws_raw/train_c_kws_raw

      - name: Diff kws_raw predictions (int32, exact match required)
        run: |
          uv run examples/_shared/compare_predictions.py \
            --pytorch examples/kws_raw/outputs/6class/pytorch_predictions.npy \
            --c examples/kws_raw/outputs/6class/c_predictions.npy \
            --dtype int32

      # Re-splits the HAR raw data (already restored/prepared above by the
      # "Cache raw datasets" + "Prepare HAR data" steps) into T=5 sequential
      # domains by subject. No network access -- fails fast if data/raw is
      # missing.
      - name: Prepare HAR domain splits (continual)
        run: uv run examples/har_classifier/prepare_domains.py

      # Machinery smoke test for the #326 continual-learning demo: single
      # seed, 2 domains, 1 epoch each -- proves the PPCA-replay pipeline
      # runs end-to-end, emits schema-valid JSON, and keeps replay memory
      # footprint constant across domains. Deliberately NOT a BWT/accuracy
      # gate (a single seed is stochastic) -- the 10-seed
      # continual-learning study is a separate, non-CI artifact.
      - name: Continual-learning mini-gate (machinery smoke, no BWT threshold)
        run: |
          DOMAINS=2 PRETRAIN_EPOCHS=1 EPOCHS_PER_DOMAIN=1 RANK=4 REPLAY=1 \
            LOG_PATH=continual_smoke.json \
            build/examples/examples/har_classifier/train_c_continual
          uv run - <<'PY'
          import json
          log = json.load(open("continual_smoke.json"))
          rows = log["accuracy_matrix"]
          assert len(rows) == 2 and len(rows[1]) == 2, rows
          assert log["replay"]["enabled"] == 1
          assert log["replay"]["footprint_constant"] is True
          assert log["replay"]["bytes_per_class"] > 0
          print("continual mini-gate OK")
          PY

  # Compile-only ARM cross-build of the core src/ libraries. Surfaces the
  # 32-bit-size_t bug class (e.g. 1<<32 shift UB, PR #297) and newlib
  # behaviors (#160) that are structurally invisible on the LP64 host jobs.
  # Toolchain = Arm GNU 13.3.Rel1, exactly the devenv gcc-arm-embedded-13
  # version. Deliberately NON-required for now; propose making it required
  # once it has been stable for a few weeks.
  c-arm-cross-compile:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake + ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache Arm GNU toolchain 13.3.Rel1
        id: arm-gcc-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-13.3.rel1-x86_64

      - name: Install Arm GNU toolchain 13.3.Rel1 (matches devenv gcc-arm-embedded-13)
        if: steps.arm-gcc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/arm-gnu.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz"
          # Pinned from Arm's official .sha256asc for 13.3.rel1 (fetched 2026-07-08);
          # supply-chain guard: fail before extracting a tampered tarball.
          echo "95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4  /tmp/arm-gnu.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-gnu-toolchain
          tar -xJf /tmp/arm-gnu.tar.xz -C ~/arm-gnu-toolchain --strip-components=1

      - name: Assert toolchain version
        run: |
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          arm-none-eabi-gcc --version | head -1
          major=$(arm-none-eabi-gcc -dumpversion | cut -d. -f1)
          if [ "$major" != "13" ]; then
            echo "::error::arm-none-eabi-gcc major is ${major}, expected 13 (devenv parity)."
            exit 1
          fi

      - name: Configure (arm_cross preset)
        run: |
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          cmake --preset arm_cross

      - name: Cross-compile core libraries (compile-only, -Werror)
        run: |
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          cmake --build --preset arm_cross

  # Portability-FLOOR cross-build (#352): the oldest arm-gcc we support.
  # The 13.3 parity job above ACCEPTS pre-C23 constructs (e.g. a declaration
  # placed directly after a `case`/`default` label) silently, as a C23
  # extension -- so it is structurally blind to code that will not compile on
  # the gcc 10.x lines still shipped by many vendor MCU SDKs. arm-gcc 10.x
  # HARD-ERRORS that whole class by default ("a label can only be part of a
  # statement"), with no flag needed and no false positives -- it is literally
  # the toolchain that surfaced #352. Ubuntu 22.04's apt gcc-arm-none-eabi is
  # the 10.3 line; the compiler and the newlib headers ship as separate
  # packages, and a compile-only build still needs the headers. Deliberately
  # NON-required, like the parity job.
  c-arm-cross-compile-min:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake + ninja + oldest-supported arm-gcc (10.x)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Assert portability floor (arm-gcc major 10)
        run: |
          arm-none-eabi-gcc --version | head -1
          major=$(arm-none-eabi-gcc -dumpversion | cut -d. -f1)
          if [ "$major" != "10" ]; then
            echo "::error::apt arm-none-eabi-gcc major is ${major}, expected 10 (the pre-C23 portability floor this job exists to guard). If the runner image bumped the package, re-pin the floor deliberately -- do not just widen this check."
            exit 1
          fi

      - name: Configure (arm_cross preset)
        run: cmake --preset arm_cross

      - name: Cross-compile core libraries (compile-only, -Werror)
        run: cmake --build --preset arm_cross

  # Stage-1 stack-watermark REPORT (hardening item 6): builds the FIVE
  # instrumented har_classifier trainers with ODT_MEM_PROFILE, runs one
  # epoch each, and reports memory.stack_peak_b against the budgets in
  # examples/_shared/check_stack_watermark.py. WARN-ONLY by design: linux
  # budgets are uncalibrated until this job has produced stable peaks;
  # calibration + --enforce promotion is a dedicated later PR. The bfp
  # bucket is uncalibrated on both platforms by design (report-only) and
  # prints UNCALIBRATED.
  c-stack-watermark:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python deps
        run: uv sync

      - name: Cache raw HAR dataset
        uses: actions/cache@v4
        with:
          path: examples/har_classifier/data/raw
          key: datasets-raw-${{ hashFiles('examples/har_classifier/prepare_data.py', 'examples/ecg_anomaly_ae/prepare_data.py', 'examples/mnist_mlp/prepare_data.py', 'examples/mnist_cnn/prepare_data.py') }}

      - name: Prepare HAR data
        run: uv run examples/har_classifier/prepare_data.py

      - name: Configure (examples_memprofile preset)
        run: cmake --preset examples_memprofile

      - name: Build instrumented HAR trainers
        run: cmake --build --preset examples_memprofile --target train_c_har_classifier train_c_har_classifier_sym train_c_har_classifier_adamw train_c_har_classifier_finetune train_c_har_classifier_bfp

      - name: Run 1-epoch watermark probes
        run: |
          EPOCHS=1 SEED=1 LOG_PATH=/tmp/wm_float.json \
            build/examples_memprofile/examples/har_classifier/train_c_har_classifier
          EPOCHS=1 SEED=1 SYM_BITS=8 LOG_PATH=/tmp/wm_sym8.json \
            build/examples_memprofile/examples/har_classifier/train_c_har_classifier_sym
          EPOCHS=1 SEED=1 LOG_PATH=/tmp/wm_adamw.json \
            build/examples_memprofile/examples/har_classifier/train_c_har_classifier_adamw
          STAGE1_EPOCHS=1 STAGE2_EPOCHS=1 SEED=1 LOG_PATH=/tmp/wm_finetune.json \
            build/examples_memprofile/examples/har_classifier/train_c_har_classifier_finetune
          EPOCHS=1 SEED=1 BFP_WEIGHT_BLOCK=32 BFP_WIRE_BLOCK=16 BFP_MANTISSA_BITS=6 BFP_EXPONENT_BITS=8 LOG_PATH=/tmp/wm_bfp.json \
            build/examples_memprofile/examples/har_classifier/train_c_har_classifier_bfp

      - name: Check stack watermarks (report-only)
        run: uv run examples/_shared/check_stack_watermark.py --platform linux /tmp/wm_float.json /tmp/wm_sym8.json /tmp/wm_adamw.json /tmp/wm_finetune.json /tmp/wm_bfp.json

  python-test:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest
